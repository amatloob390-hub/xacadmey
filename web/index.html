<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Xacademy - Online Live Learning Portal">

  <!-- Preload core Flutter assets for ultra-fast startup -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Xacademy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Xacademy</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#0F172A;margin:0;overflow:hidden;">
  <style>
    #x-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F172A;color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;transition:opacity .25s ease-out}
    .x-spinner{width:46px;height:46px;border:3.5px solid rgba(16,185,129,0.18);border-top-color:#10B981;border-right-color:#2563EB;border-radius:50%;animation:xspin .7s cubic-bezier(0.4,0,0.2,1) infinite}
    .x-brand{margin-top:16px;font-weight:800;font-size:16px;letter-spacing:1.5px;background:linear-gradient(135deg,#10B981,#3B82F6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .x-sub{margin-top:6px;font-size:12px;color:#94A3B8;letter-spacing:0.3px}
    @keyframes xspin{to{transform:rotate(360deg)}}
  </style>
  <div id="x-loader">
    <div class="x-spinner"></div>
    <div class="x-brand">XACADEMY</div>
    <div class="x-sub">لوڈ ہو رہا ہے… &nbsp;|&nbsp; Loading…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('x-loader');
      if (l) { 
        l.style.opacity = '0'; 
        setTimeout(function () { l.remove(); }, 250); 
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
