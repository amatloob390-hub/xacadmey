<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Xacademy - Online Live Learning Portal">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Font & Network Optimizations for Super Fast Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Xacademy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Xacademy</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #x-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F172A;color:#F8FAFC;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;z-index:99999;transition:opacity .3s ease}
    #x-loader .ring{width:48px;height:48px;border:4px solid rgba(217,119,6,.2);border-top-color:#D97706;border-radius:50%;animation:xspin .8s linear infinite}
    #x-loader .txt{margin-top:16px;font-size:14px;letter-spacing:.5px;color:#CBD5E1}
    #x-loader .brand{margin-top:6px;font-weight:700;font-size:14px;letter-spacing:1px;color:#D97706}
    @keyframes xspin{to{transform:rotate(360deg)}}
  </style>
  <div id="x-loader">
    <div class="ring"></div>
    <div class="txt">لوڈ ہو رہا ہے… &nbsp;/&nbsp; Loading…</div>
    <div class="brand">XACADEMY</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('x-loader');
      if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
